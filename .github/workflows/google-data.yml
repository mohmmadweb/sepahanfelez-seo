# Google data for the sepahanfelez.ir dashboard. Everything else runs on our server; only this
# runs here, because Google's API front-ends answer 403 to the server's IP. The result is
# encrypted with SF_STATE_KEY before it touches the (public) repo, and the server decrypts it
# with the same key from its .env.
name: Google data

on:
  schedule:
    - cron: "0 3 * * *"          # 06:30 Tehran — before the server's 07:15 run
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dashboard/requirements.txt
      - run: pip install -r dashboard/requirements.txt
      - name: Collect and encrypt
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          SF_STATE_KEY: ${{ secrets.SF_STATE_KEY }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
        run: python dashboard/collect_google.py "$RUNNER_TEMP/google.enc"
      - name: Publish to branch google-data
        run: |
          mkdir -p "$RUNNER_TEMP/out" && cd "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/google.enc" .
          git init -q -b google-data
          git config user.name "sepahanfelez-seo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add google.enc && git commit -qm "google data $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" google-data
